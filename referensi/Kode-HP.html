<!doctype html>

<title>Ngebola — Kode verifikasi (HP)</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#123b2c;font-weight:700}a:hover{color:#0b2419}
</style>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #f2ede0; color: #14201a; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;">

  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 200px; background-color: #123b2c; background-image: repeating-linear-gradient(90deg, #123b2c 0 48px, #164535 48px 96px);">
    <a href="Login-HP.html" aria-label="Kembali" style="position: absolute; left: 20px; top: 52px; width: 44px; height: 44px; border-radius: 12px; border: 2px solid #f2ede0; color: #f2ede0; display: flex; align-items: center; justify-content: center; box-sizing: border-box;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
    <img src="../assets/logo/svg/ngebola-lockup-gelap.svg" alt="Ngebola" style="position: absolute; right: 24px; top: 58px; height: 30px; width: auto;">
  </div>

  <main style="position: absolute; left: 0; top: 168px; width: 390px; bottom: 0; box-sizing: border-box; padding: 32px 24px 0; background: #f2ede0; border-top: 2px solid #14201a; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; gap: 22px;">
    <div style="width: 60px; height: 60px; border-radius: 16px; border: 2px solid #14201a; background: #c9a14a; box-shadow: 0 4px 0 #14201a; display: flex; align-items: center; justify-content: center; box-sizing: border-box;"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#14201a" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1.5"></rect><path d="M3.5 6l8.5 7 8.5-7"></path></svg></div>
    <div>
      <h1 style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; color: #123b2c;">Cek email kamu</h1>
      <p style="margin: 8px 0 0; font-size: 15px; line-height: 1.5; color: #3b4a41;">Kode 6 digit sudah dikirim ke<br><b style="color: #14201a;">rizky@contoh.com</b> · <a href="Login-HP.html">Ganti</a></p>
    </div>

    <div role="group" aria-label="Kode 6 digit" style="display: flex; gap: 8px;">
      <input aria-label="Digit 1" value="4" inputmode="numeric" autocomplete="one-time-code" style="width: 47px; height: 60px; box-sizing: border-box; text-align: center; border: 2px solid #123b2c; border-radius: 12px; background: #fbf8f1; font-family: inherit; font-size: 26px; font-weight: 800; color: #123b2c; outline: none;">
      <input aria-label="Digit 2" value="8" inputmode="numeric" style="width: 47px; height: 60px; box-sizing: border-box; text-align: center; border: 2px solid #123b2c; border-radius: 12px; background: #fbf8f1; font-family: inherit; font-size: 26px; font-weight: 800; color: #123b2c; outline: none;">
      <input aria-label="Digit 3" value="2" inputmode="numeric" style="width: 47px; height: 60px; box-sizing: border-box; text-align: center; border: 2px solid #123b2c; border-radius: 12px; background: #fbf8f1; font-family: inherit; font-size: 26px; font-weight: 800; color: #123b2c; outline: none;">
      <input aria-label="Digit 4" value="9" inputmode="numeric" style="width: 47px; height: 60px; box-sizing: border-box; text-align: center; border: 2px solid #123b2c; border-radius: 12px; background: #fbf8f1; font-family: inherit; font-size: 26px; font-weight: 800; color: #123b2c; outline: none;">
      <input aria-label="Digit 5" value="" inputmode="numeric" style="width: 47px; height: 60px; box-sizing: border-box; text-align: center; border: 2px solid #123b2c; border-radius: 12px; background: #ffffff; box-shadow: 0 0 0 4px rgba(201,161,74,.6); font-family: inherit; font-size: 26px; font-weight: 800; color: #123b2c; outline: none;">
      <input aria-label="Digit 6" value="" inputmode="numeric" style="width: 47px; height: 60px; box-sizing: border-box; text-align: center; border: 2px solid #cfc6b1; border-radius: 12px; background: #fbf8f1; font-family: inherit; font-size: 26px; font-weight: 800; outline: none;">
    </div>

    <p style="margin: -6px 0 0; display: flex; gap: 8px; align-items: center; font-size: 14px; color: #3b4a41;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5h5"></path></svg>Kirim ulang kode dalam <b style="color: #14201a;">0:45</b></p>

    <button disabled style="height: 56px; border-radius: 14px; border: 2px solid #cfc6b1; background: #e4ddcc; color: #6f6a5a; box-shadow: none; font-family: inherit; font-size: 17px; font-weight: 800; cursor: not-allowed;">Masuk</button>
    <p style="margin: -10px 0 0; font-size: 13px; line-height: 1.5; color: #3b4a41; text-align: center;">Isi 6 digit — kamu langsung masuk otomatis.<br>Tidak ada di kotak masuk? Cek folder Spam.</p>
  </main>

  <img src="../assets/maskot/pakbola-maskot-terang.png" alt="" style="position: absolute; right: -34px; bottom: -40px; height: 210px; width: auto; transform: rotate(-8deg);">
</div>

</html>
