<style>
body{margin:0}

</style>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #f2ede0; color: #14201a; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;">

  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 340px; background-color: #123b2c; background-image: repeating-linear-gradient(90deg, #123b2c 0 48px, #164535 48px 96px);">

    <div style="position: absolute; left: 0; top: 400px; width: 390px; height: 2px; background: rgba(242,237,224,.18);"></div>

    <div>
      <h1 style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; color: #123b2c;">Masuk ke Ngebola</h1>
      <p style="margin: 6px 0 0; font-size: 15px; line-height: 1.45; color: #3b4a41;">Cari lawan sparring &amp; urus iuran tim, tanpa ribet di grup WA.</p>
    </div>

    <button style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; border-radius: 12px; border: 2px solid #14201a; background: #ffffff; color: #14201a; box-shadow: 0 4px 0 #14201a; font-family: inherit; font-size: 16px; font-weight: 700;"><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; border: 1.5px dashed #6f6a5a; color: #6f6a5a; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-sizing: border-box;">G</span>Lanjut dengan Google</button>

    <div style="display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 700; color: #6f6a5a;"><span style="flex: 1 1 auto; height: 2px; background: #cfc6b1;"></span>atau pakai email<span style="flex: 1 1 auto; height: 2px; background: #cfc6b1;"></span></div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <label for="em" style="font-size: 14px; font-weight: 700;">Email</label>
      <input id="em" type="email" autocomplete="email" placeholder="nama@email.com" style="height: 52px; box-sizing: border-box; padding: 0 16px; border: 2px solid #123b2c; border-radius: 12px; background: #fbf8f1; font-family: inherit; font-size: 16px; color: #14201a; outline: none;">
    </div>

    <a href="Kode-HP.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; border-radius: 14px; border: 2px solid #123b2c; background: #123b2c; color: #f2ede0; box-shadow: 0 5px 0 #c9a14a; font-size: 17px; font-weight: 800; text-decoration: none;">Lanjut dengan Email<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
